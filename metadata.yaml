name: astrbot_plugin_chat_digest
display_name: 群聊记忆与摘要助手
desc: 群聊/私聊记忆与智能摘要助手：LLM 摘要（自动降级本地规则）、精华收藏、决议/待办追踪、网页链接静默收录与摘要、RSS 订阅汇总、每日定时日报、Markdown/JSON 导入导出与 Pillow 摘要长图
help: |
  统一入口：/摘要（别名 /digest、/纪要）
  - /摘要 [今日|条数|YYYY-MM-DD] [--card]：生成当前会话摘要（优先 LLM，自动降级规则）
  - /摘要 精华 [添加 <内容>|列表|删除 <ID>]：管理本会话精华记忆
  - /摘要 待办 [添加 <内容>|列表|完成 <ID>|删除 <ID>]：追踪决议与待办
  - /摘要 搜索 <关键词>：跨摘要、精华、待办、链接与聊天记录全文检索
  - /摘要 回顾 [YYYY-MM-DD|N]：查看历史摘要档案
  - /摘要 链接 [<URL>|列表|删除 <ID>]：手动摘要网页或查看静默收录的链接
  - /摘要 rss [添加 <名称> <URL>|列表|拉取|删除 <ID>]：订阅并汇总 RSS/Atom 源
  - /摘要 订阅 [on|off|状态]：开关每日定时日报推送（管理员）
  - /摘要 导出 [md|json|card] / 导入 <JSON>：导出档案/摘要长图或导入恢复（管理员）
  - /摘要 状态 / 清空 确认 / 帮助：查看运行状态、清空会话数据或查看完整帮助
version: 1.1.1
author: 云晓
repo: https://github.com/yunxiao258/astrbot_plugin_chat_digest
